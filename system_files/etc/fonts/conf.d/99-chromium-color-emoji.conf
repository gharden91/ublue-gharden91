<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Make Chromium-based apps render color emoji. See docs/fonts.md for the full
  diagnosis; the short version:

  Fedora 43+ ships Noto Color Emoji as COLRv1 (Noto-COLRv1.ttf). Chromium's
  font stack cannot resolve that font on this image at all — not as a fallback
  and not even when a page asks for font-family:'Noto Color Emoji' explicitly —
  so Microsoft Edge and Electron apps (VS Code) render emoji as tofu boxes.
  Qt/GTK/Firefox render the same font correctly, which is what makes the
  breakage look Edge-specific.

  build.sh installs upstream's CBDT (bitmap) build of the same font, which
  Chromium has supported for years. Both files declare the identical family
  name "Noto Color Emoji", so without this file the winner is decided by
  fontconfig's scan order — which resolves to the COLRv1 file and leaves emoji
  broken. Rejecting the COLRv1 file makes the CBDT build the only candidate,
  so every app gets a deterministic, working answer.

  Consequence worth knowing: apps that handle COLRv1 fine (Firefox, Qt/GTK)
  also move to the bitmap build. Bitmap emoji are slightly less crisp at very
  large sizes. That is the cost of a single consistent emoji font across the
  system, and it reverses cleanly — delete this file and the font install in
  build.sh, and the system is back to stock COLRv1.

  The glob is path-agnostic (matches any font directory) so a Fedora path
  change doesn't silently disable it. build.sh asserts the intended font wins
  and fails loudly in the build log if it stops matching.
-->
<fontconfig>

  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/*/Noto-COLRv1*.ttf</glob>
    </rejectfont>
  </selectfont>

</fontconfig>
